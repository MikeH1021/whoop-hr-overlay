name: Build Windows EXE

# Builds ONE standalone Windows .exe (overlay + bundled USB-dongle driver
# installer) on a GitHub-hosted Windows runner and attaches it to a GitHub
# Release. Triggers on a version tag (e.g. v0.3.1), or manually from Actions.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Fetch + verify dongle driver installer (Zadig)
        shell: pwsh
        run: |
          $url = "https://github.com/pbatard/libwdi/releases/download/v1.5.1/zadig-2.9.exe"
          $expected = "4ecaa95df3da3621486a043aef8b3050b8bafe7c901402871e816229ef82039b"
          Invoke-WebRequest $url -OutFile drivers\zadig-2.9.exe
          $hash = (Get-FileHash drivers\zadig-2.9.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $expected) { throw "Zadig SHA-256 mismatch: $hash" }
          $sig = Get-AuthenticodeSignature drivers\zadig-2.9.exe
          Write-Host "Zadig signature: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Akeo") {
            throw "Zadig Authenticode check failed: $($sig.Status)"
          }

      - name: Build standalone exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name whoop-hr-overlay
          --collect-all bleak --collect-all bumble --collect-all libusb_package
          --hidden-import usb1 --hidden-import dongle_source --hidden-import active_source --hidden-import settings_dialog
          --add-data "drivers/zadig-2.9.exe;drivers"
          --add-data "drivers/zadig.ini;drivers"
          main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: whoop-hr-overlay-windows
          path: dist/whoop-hr-overlay.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/whoop-hr-overlay.exe
          body: |
            ## WHOOP Heart Rate Overlay

            **Download `whoop-hr-overlay.exe` below. That's the only file you need.**

            1. Double-click it. (Windows may say "unknown publisher": **More info → Run anyway**.)
            2. Right-click the **heart in the system tray** → **Choose your WHOOP** → pick your band.
            3. Wear the band. Your heart rate + a 30-second graph appear top-left.

            **Using the nRF52840 USB dongle?** Just plug it in. If it needs its driver, the overlay
            pops up a notice: right-click the tray heart → **Install USB dongle driver**, pick
            **WHOOP HR Overlay HCI**, click **Replace Driver**. One time; the overlay switches to the
            dongle by itself.

            **To show it in Discord:** share your whole **Screen**, and run the game in
            **Borderless / Windowed Fullscreen**.

            Bundled driver installer: Zadig 2.9 (GPLv3, Akeo Consulting, github.com/pbatard/libwdi).
