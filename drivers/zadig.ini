; Zadig reads this file from its own folder.
; Preset for the WHOOP HR Overlay USB dongle: show all devices, default to WinUSB.
[general]
  advanced_mode = false
  exit_on_success = true
  log_level = 0

[device]
  list_all = true
  include_hubs = false
  trim_whitespaces = true

[driver]
  ; 0 = WinUSB
  default_driver = 0
  extract_only = false

[security]
  disable_cert_install_popup = false
