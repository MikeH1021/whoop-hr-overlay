CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_BUF_CMD_TX_COUNT=10

# new USB device stack (the legacy one reboot-loops on this dongle)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_BT_HCI=y
CONFIG_SAMPLE_USBD_PID=0x000b
CONFIG_SAMPLE_USBD_PRODUCT="WHOOP HR Overlay HCI"

# no console / CDC ACM on the dongle (the board's CDC backend would also
# pull in the legacy USB stack alongside device_next)
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# dongle has no 32.768 kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Power: use the LDO (works on any hardware); DCDC brown-out loops this dongle
CONFIG_BOARD_ENABLE_DCDC=n
CONFIG_BOARD_ENABLE_DCDC_HV=n
